<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing - Lab 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #007bc7;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .box {
            text-align: left;
            background: #eef6fc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .box h3 {
            font-size: 16px;
            color: #007bc7;
            margin-bottom: 8px;
        }
        .box ul {
            list-style-type: square;
            padding-left: 20px;
            color: #444;
        }
        .box li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello From The Cloud! ☁️</h1>
        <p>Boggani wuxuu u djsan yahay qaab PaaS ah oo ku shaqaynaya <strong>GitHub Pages</strong>.</p>

        <div class="box">
            <h3>Faahfaahinta Lab-ka:</h3>
            <ul>
                <li>Adeegga Cloud-ka: PaaS (Platform as a Service)[cite: 2]</li>
                <li>Qalabka: GitHub Pages & HTML/CSS[cite: 2]</li>
                <li>Xaaladda: Website-ku wuxuu ka shaqaynayaa si toos ah (Live)[cite: 2]</li>
            </ul>
        </div>
    </div>

</body>
</html>
