<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Computing - Lab 1 Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #007bc7;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .features {
            text-align: left;
            background: #eef6fc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .features h3 {
            font-size: 16px;
            color: #007bc7;
            margin-bottom: 8px;
        }

        .features ul {
            list-style-type: square;
            padding-left: 20px;
            color: #444;
        }

        .features li {
            margin-bottom: 5px;
        }

        .btn {
            display: inline-block;
            background-color: #007bc7;
            color: #ffffff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #005a93;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello From The Cloud! ☁️</h1>
        <p>Ku soo dhawoow website-kayga yar oo ku shaqaynaya <strong>GitHub Pages (PaaS)</strong>!</p>

        <div class="features">
            <h3>Adeegyada aan bixin karo:</h3>
            <ul>
                <li>Naqshadaynta bogagga fudud ee HTML & CSS</li>
                <li>Habeynta iyo martigelinta GitHub Pages</li>
                <li>Aasaaska maamulka Cloud-ka & IAM</li>
            </ul>
        </div>

        <a href="#" class="btn">Wax badan baro</a>
    </div>

</body>
</html>
